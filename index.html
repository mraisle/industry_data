const KC={com:["var(--bg-success)","var(--text-success)"],pre:["var(--bg-warning)","var(--text-warning)"],inc:["var(--surface-1)","var(--text-secondary)"]};
const GC={Operating:"success",Construction:"success",Approved:"success",Committed:"success",FEED:"warning",Lab:"warning","Pre-FID":"warning",Stalled:"danger",Paused:"danger",Gap:"danger"};
let ci="d",si=1;

function grid(){document.getElementById("grid").innerHTML=D.map(c=>{
let h=`<div class="col"><div class="hd" style="background:${KC[c.k][0]};color:${KC[c.k][1]}">${c.h}</div><div class="vol" style="background:${KC[c.k][0]};color:${KC[c.k][1]}">${c.v}</div><div class="ar">↓</div>`;
c.s.forEach((s,i)=>{h+=`<button class="bx" aria-pressed="${c.id===ci&&i===si}" onclick="sel('${c.id}',${i})">${s.t}</button><div class="ar">↓</div>`});
h+=`<div class="em" style="background:${KC[c.k][0]};color:${KC[c.k][1]}">${c.e}</div></div>`;
return h}).join("")}

function panel(){const c=D.find(x=>x.id===ci),s=c.s[si];
document.getElementById("ctx").textContent=c.h+" · "+c.v+" · step "+(si+1)+" of 4";
document.getElementById("stt").textContent=s.t;
document.getElementById("std").textContent=s.d;
document.getElementById("cnt").textContent=s.p.length+" rows at this step";
document.getElementById("list").innerHTML=s.p.map(p=>{
const b=c.dt?`<span class="bd nb">${p.g}</span>`:`<span class="bd" style="background:var(--bg-${GC[p.g]||"neutral"});color:var(--text-${GC[p.g]||"secondary"})">${p.g}</span>`;
const src=p.s?` <a class="src" href="${p.s}">${p.sn} ↗</a>`:(p.u?' <span style="font-size:12px;color:var(--text-danger)">unverified</span>':"");
return `<div class="pj">${b}<div style="flex:1;min-width:0"><p style="font-size:14px;font-weight:500;margin:0 0 2px">${p.n} <span style="font-size:13px;font-weight:400;color:var(--text-muted)">${p.l}</span></p>
<p style="font-size:13px;color:var(--text-secondary);margin:0;line-height:1.5">${p.x}${src}</p></div></div>`}).join("")}

function sel(id,i){ci=id;si=i;grid();panel()}
grid();panel();
</script>
